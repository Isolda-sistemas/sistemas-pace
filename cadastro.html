<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema PACE - Cadastro de Participante</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Cadastro de Participante</h2>
        <form id="cadastroForm">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Digite o nome completo">
            </div>
            <div class="input-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" required placeholder="000.000.000-00">
            </div>
            <div class="input-group">
                <label for="telefone">Telefone / WhatsApp</label>
                <input type="tel" id="telefone" required placeholder="(89) 90000-0000">
            </div>
            <div class="input-group">
                <label for="bairro">Bairro / Comunidade</label>
                <input type="text" id="bairro" required placeholder="Digite o bairro">
            </div>
            <div class="button-group">
                <button type="submit">Salvar Cadastro</button>
                <a href="dashboard.html" class="btn-voltar">Voltar ao Dashboard</a>
            </div>
        </form>
    </div>
</body>
</html>
